<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Stake Bonus 20</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<style>
.adm{max-width:960px;margin:0 auto;padding:32px 16px 80px}
.adm-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.adm-top h1{font-size:26px;margin-right:auto}
.badge{background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px;margin-left:8px;vertical-align:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);color:var(--muted);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--blue);color:#fff}
.msg{background:var(--card);border-radius:12px;margin-bottom:10px;border-left:4px solid transparent}
.msg.new{border-left-color:var(--blue2)}
.msg summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.msg summary::-webkit-details-marker{display:none}
.msg .who{font-weight:800}.msg.new .who::before{content:"● ";color:var(--blue2)}
.msg .meta{color:var(--dim);font-size:13px;text-align:right}
.msg .prev{color:var(--muted);font-size:14px;grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .body{padding:0 18px 16px}
.msg .body p{white-space:pre-wrap;color:#dfe6f3;background:var(--bg);border-radius:8px;padding:14px;margin:0 0 12px}
.act{display:flex;gap:8px;flex-wrap:wrap}
.mini{background:var(--card2);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.mini.red{background:rgba(237,65,99,.2);color:#ff8fa3}
.tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;border-radius:999px;padding:2px 8px;background:rgba(20,117,225,.18);color:#7cc0ff;margin-left:8px}
.tag.affiliate{background:rgba(0,231,1,.12);color:var(--green)}
.box{background:var(--card);border-radius:14px;padding:24px;max-width:420px;margin:60px auto}
.box input{width:100%;background:var(--bg);border:1px solid var(--card2);color:#fff;border-radius:8px;padding:12px;font:inherit;margin:6px 0 14px}
.flash{background:rgba(237,65,99,.15);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.empty{text-align:center;color:var(--dim);padding:40px;background:var(--card);border-radius:12px}
</style></head><body>

<div class="box" id="login">
  <a class="logo" href="/">Stake Bonus <b>20</b></a>
  <h1 style="font-size:24px;margin:18px 0 6px">Connexion admin</h1>
  <p>Le mot de passe est celui défini dans Vercel (variable <code>ADMIN_PASSWORD</code>).</p>
  <div class="flash" id="err" hidden></div>
  <form id="lf"><label>Mot de passe</label><input type="password" id="pw" required autofocus autocomplete="current-password">
  <button class="btn" style="width:100%">Se connecter</button></form>
</div>

<div class="adm" id="app" hidden>
  <div class="adm-top">
    <h1>Messages<span class="badge" id="badge" hidden></span></h1>
    <button class="mini" id="readall">Tout marquer comme lu</button>
    <a class="mini" href="/">Voir le site</a>
    <button class="mini" id="logout">Déconnexion</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
</div>

<script>
(function(){
  var pw='',msgs=[],filter='all',open=null;
  try{pw=sessionStorage.getItem('sb20pw')||''}catch(e){}
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var ERR={auth:'Mot de passe incorrect.',storage:'Base de données non connectée : ajoute « Upstash for Redis » dans Vercel → Storage.',nopass:'Ajoute la variable ADMIN_PASSWORD (10 caractères minimum) dans Vercel → Settings → Environment Variables.',server:'Erreur serveur, réessaie.'};
  function call(action,id){
    return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,action:action||'list',id:id||''})})
      .then(function(r){return r.json()}).then(function(d){
        if(!d.ok){if(d.error==='auth'){try{sessionStorage.removeItem('sb20pw')}catch(e){}$('app').hidden=true;$('login').hidden=false}
          $('err').hidden=false;$('err').textContent=ERR[d.error]||'Erreur.';return}
        $('login').hidden=true;$('app').hidden=false;msgs=d.messages;render();
      }).catch(function(){$('err').hidden=false;$('err').textContent=ERR.server});
  }
  function render(){
    var unread=msgs.filter(function(m){return !m.read}).length;
    document.title=(unread?'('+unread+') ':'')+'Admin · Stake Bonus 20';
    $('badge').hidden=!unread;$('badge').textContent=unread+(unread>1?' nouveaux':' nouveau');
    $('readall').hidden=!unread;
    var tabs=[['all','Tous ('+msgs.length+')'],['unread','Non lus ('+unread+')'],['affiliate','Affiliation'],['contact','Contact']];
    $('tabs').innerHTML=tabs.map(function(t){return '<button data-f="'+t[0]+'" class="'+(filter===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
    var shown=msgs.filter(function(m){return filter==='all'||(filter==='unread'&&!m.read)||m.topic===filter});
    if(!shown.length){$('list').innerHTML='<div class="empty">Aucun message ici pour l’instant.</div>';return}
    $('list').innerHTML=shown.map(function(m){
      var d=new Date(m.date).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
      return '<details class="msg'+(m.read?'':' new')+'" data-id="'+m.id+'"'+(open===m.id?' open':'')+'><summary><span class="who">'+esc(m.name)+'<span class="tag '+m.topic+'">'+(m.topic==='affiliate'?'Affiliation':'Contact')+'</span></span><span class="meta">'+d+'</span><span class="prev">'+esc(m.message.slice(0,140))+'</span></summary>'+
        '<div class="body"><p>'+esc(m.message)+'</p><div class="act"><a class="mini" href="mailto:'+esc(m.email)+'?subject='+encodeURIComponent('Re: Stake Bonus 20')+'">Répondre à '+esc(m.email)+'</a>'+
        '<button class="mini" data-a="'+(m.read?'unread':'read')+'">'+(m.read?'Marquer non lu':'Marquer comme lu')+'</button><button class="mini red" data-a="delete">Supprimer</button></div></div></details>';
    }).join('');
  }
  $('lf').addEventListener('submit',function(e){e.preventDefault();pw=$('pw').value;try{sessionStorage.setItem('sb20pw',pw)}catch(e){}call('list')});
  $('logout').addEventListener('click',function(){pw='';try{sessionStorage.removeItem('sb20pw')}catch(e){}location.reload()});
  $('readall').addEventListener('click',function(){call('readall')});
  $('tabs').addEventListener('click',function(e){var f=e.target.dataset.f;if(f){filter=f;render()}});
  $('list').addEventListener('click',function(e){var a=e.target.dataset.a;if(!a)return;var id=e.target.closest('details').dataset.id;
    if(a==='delete'&&!confirm('Supprimer ce message ?'))return;open=a==='delete'?null:id;call(a,id)});
  $('list').addEventListener('toggle',function(e){var d=e.target;if(d.open){open=d.dataset.id;var m=msgs.find(function(x){return x.id===open});if(m&&!m.read)call('read',m.id)}},true);
  setInterval(function(){if(pw&&!document.querySelector('details[open]'))call('list')},60000);
  if(pw)call('list');
})();
</script>
</body></html>
